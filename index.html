<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Konvex — Coming Soon</title>
  <meta name="description" content="Konvex is a premium industrial technology brand preparing for its official launch. Our new website is coming soon — reach us by phone or visit our address.">
  <meta name="theme-color" content="#0e1113">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="index, follow">
  <meta name="author" content="Konvex">

  <!-- Open Graph / social sharing -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Konvex">
  <meta property="og:title" content="Konvex — Coming Soon">
  <meta property="og:description" content="Konvex is a premium industrial technology brand preparing for its official launch. Our new website is coming soon.">
  <meta property="og:image" content="assets/img/konvex-logo.jpg">
  <meta property="og:image:width" content="959">
  <meta property="og:image:height" content="934">
  <meta property="og:image:alt" content="Konvex logo">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Konvex — Coming Soon">
  <meta name="twitter:description" content="Konvex is a premium industrial technology brand preparing for its official launch.">
  <meta name="twitter:image" content="assets/img/konvex-logo.jpg">

  <link rel="icon" type="image/jpeg" href="assets/img/konvex-logo.jpg">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <!-- Decorative parallax particle field (canvas, non-interactive) -->
  <canvas id="particles" class="particles" aria-hidden="true"></canvas>

  <main class="stage">

    <section class="hero">
      <!-- Official Konvex logo — used exactly as supplied, never altered -->
      <img
        class="hero__logo"
        src="assets/img/konvex-logo.jpg"
        alt="Konvex"
        width="959"
        height="934"
        fetchpriority="high"
        decoding="async">

      <div class="hero__caption">
        <h1 class="hero__title">
          <span class="sr-only">Konvex — </span>Coming Soon
        </h1>
      </div>
    </section>

    <footer class="contact">
      <ul class="contact__list">
        <li class="contact__item">
          <span class="contact__label">Phone</span>
          <!-- PLACEHOLDER: replace [PHONE_NUMBER] in the text and in the tel: href -->
          <a class="contact__value contact__value--phone" href="tel:[PHONE_NUMBER]">021-66 413 415</a>
        </li>
        <li class="contact__item">
          <span class="contact__label"></span>
          <!-- PLACEHOLDER: replace [BUSINESS_ADDRESS] -->
          <address class="contact__value contact__value--address">No. 20, Jamaldara Alley, Shojaei Alley, Hasanabad Sq., Imam Khomeini St., Tehran, Iran</address>
        </li>
      </ul>
    </footer>

  </main>

  <script src="assets/js/particles.js" defer></script>
</body>
</html>
